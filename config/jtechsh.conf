# JtechSH default configuration
#
# This file is tracked in git and MUST NOT contain secrets
# (API keys, tokens, passwords, credentials).
#
# On first run, this file is copied to ~/.config/jtechsh/config
# where you can safely override any of these values.
# The user copy is NOT tracked by this repository.

# Prompt symbol shown before each command
JTECHSH_PROMPT_SYMBOL="jtech>"

# Number of commands to keep in shell history
JTECHSH_HISTORY_SIZE=1000

# Show ASCII banner on startup (1 = yes, 0 = no)
JTECHSH_SHOW_BANNER=1

# Reserved for future phases (0.2+): audit database location, etc.
# JTECHSH_AUDIT_DB="$HOME/.jtechsh/data/audit.db"
